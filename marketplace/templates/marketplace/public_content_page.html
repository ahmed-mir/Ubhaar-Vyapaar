{% extends "marketplace/base.html" %}
{% load static %}

{% block extra_css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'marketplace/css/public-content.css' %}">
{% endblock %}

{% block content %}
<article class="public-content-page">
    <header class="public-content-heading">
        <p class="eyebrow">{% block page_eyebrow %}{% endblock %}</p>
        <h1>{% block page_h1 %}{% endblock %}</h1>
        {% block page_lead %}{% endblock %}
    </header>
    <div class="public-content-body">
        {% block page_body %}{% endblock %}
    </div>
</article>
{% endblock %}
