{% load static %}
{% if listing.image %}
    <img
        class="{{ image_class|default:'listing-image' }}"
        src="{{ listing.image.url }}"
        alt="{% if listing.machine_type %}{{ listing.machine_type }}{% elif listing.materials %}{{ listing.materials }}{% else %}{{ listing.get_category_display }}{% endif %} manufacturing capacity image"
        loading="{{ image_loading|default:'lazy' }}"
        decoding="async"
        width="800"
        height="600"
        onerror="this.closest('[data-listing-media]').classList.add('media-failed'); this.remove();"
    >
{% endif %}

<div class="{{ placeholder_class|default:'listing-image-placeholder' }}" aria-hidden="true">
    <span class="fallback-brand-mark"><img src="{% static 'marketplace/images/brand/logo-mark.svg' %}" alt="" width="20" height="20"></span>
    <svg class="fallback-geometry" viewBox="0 0 160 120" focusable="false" aria-hidden="true">
        <path d="M34 46h92v50H34z"></path>
        <path d="M34 60h92M58 46v14M82 46v14M106 46v14M48 74h16v22H48zM78 74h16v22H78z"></path>
    </svg>
    <span class="placeholder-category">{{ listing.get_category_display }}</span>
    <span class="placeholder-capability">Image not provided</span>
</div>
