{% if listing.image %}
    <img
        class="{{ image_class|default:'listing-image' }}"
        src="{{ listing.image.url }}"
        alt="{{ listing.title }} by {{ listing.manufacturer.business_name }}"
        loading="lazy"
        width="800"
        height="600"
        onerror="this.closest('[data-listing-media]').classList.add('media-failed'); this.remove();"
    >
{% endif %}

<div class="{{ placeholder_class|default:'listing-image-placeholder' }}" aria-hidden="true">
    <span class="fallback-brand-mark">UV</span>
    <svg class="fallback-geometry" viewBox="0 0 160 120" focusable="false" aria-hidden="true">
        <path d="M20 84 L64 28 L112 84 Z"></path>
        <rect x="58" y="58" width="72" height="28" rx="4"></rect>
        <circle cx="42" cy="84" r="10"></circle>
        <circle cx="122" cy="84" r="10"></circle>
    </svg>
    <span class="placeholder-category">{{ listing.get_category_display }}</span>
    <strong>{{ listing.title|truncatewords:4 }}</strong>
    <span class="placeholder-capability">
        {% if listing.machine_type %}
            {{ listing.machine_type }}
        {% elif listing.materials %}
            {{ listing.materials }}
        {% else %}
            Manufacturing capacity
        {% endif %}
    </span>
</div>
