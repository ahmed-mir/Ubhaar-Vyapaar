{% load accessibility %}
<div class="form-field{% if field.errors %} form-field-error{% endif %}">
    {{ field.label_tag }}
    {{ field|render_accessible_field }}
    {% if field.help_text %}
        <p id="{{ field.auto_id }}_helptext" class="helptext">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <div id="{{ field.auto_id }}_error" class="field-errors" role="alert">
            <ul class="errorlist">
                {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
            </ul>
        </div>
    {% endif %}
</div>
