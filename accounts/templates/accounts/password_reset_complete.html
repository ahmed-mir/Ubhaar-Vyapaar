{% extends "marketplace/base.html" %}

{% block title %}Password reset complete | Ubhaar-Vyapaar{% endblock %}

{% block content %}
<section class="auth-page-shell password-reset-layout" aria-labelledby="reset-complete-title">
    <div class="auth-page-main password-reset-main password-reset-state">
        <p class="eyebrow">Account access</p>
        <span class="status-pill status-accepted">Password updated</span>
        <h1 id="reset-complete-title">Password reset complete</h1>
        <p class="password-reset-intro">You can now sign in with your new password.</p>
        <a class="button button-primary password-reset-state-action" href="{% url 'login' %}">Log in</a>
    </div>
</section>
{% endblock %}
