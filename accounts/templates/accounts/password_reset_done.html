{% extends "marketplace/base.html" %}

{% block title %}Reset instructions | Ubhaar-Vyapaar{% endblock %}

{% block content %}
<section class="auth-page-shell password-reset-layout" aria-labelledby="reset-sent-title">
    <div class="auth-page-main password-reset-main password-reset-state">
        <p class="eyebrow">Account access</p>
        <span class="status-pill status-accepted">Request received</span>
        <h1 id="reset-sent-title">Check your email</h1>
        <p class="password-reset-intro">If an eligible account matches that email, password reset instructions have been sent.</p>
        <a class="button button-primary password-reset-state-action" href="{% url 'login' %}">Log in</a>
    </div>
</section>
{% endblock %}
