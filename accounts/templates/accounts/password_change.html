{% extends "marketplace/base.html" %}

{% block title %}Change password | Ubhaar-Vyapaar{% endblock %}

{% block content %}
    <section class="auth-card" aria-labelledby="password-title">
        <a href="{% url 'home' %}">← Home</a>

        <h1 id="password-title">Change your password</h1>

        <p class="auth-intro">
            Enter your current password, then choose and confirm
            your new password.
        </p>

        <form method="post" class="styled-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="button form-submit" type="submit">
                Update password
            </button>
        </form>
    </section>
{% endblock %}
